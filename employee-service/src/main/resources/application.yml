server:
  port: 8092

spring:
  application:
    name: employee-service

  datasource:
    url: jdbc:mariadb://db-24.cfwes6ek4ysk.eu-north-1.rds.amazonaws.com:3306/db-24
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  h2:
    console:
      enabled: false
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://<EUREKA_IP>:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true