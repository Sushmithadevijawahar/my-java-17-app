name: CI - dep Service

on:
  push:
    paths:
      - "department-service/**"
      - "pom.xml"
  pull_request:
    paths:
      - "department-service/**"
      - "pom.xml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build department Service
        run: mvn clean install -pl department-service -am -DskipTests
