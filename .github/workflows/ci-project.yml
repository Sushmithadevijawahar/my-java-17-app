name: Deploy project Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3️⃣ BUILD (IMPORTANT: cd into service)
      - name: Build project Service
        run: |
          cd project-service
          mvn clean package -DskipTests

      # 4️⃣ DEBUG (KEEP until pipeline is green)
      - name: Verify JAR
        run: |
          ls -l project-service/target
          find . -name "*.jar"

      # 5️⃣ COPY JAR TO EC2  ✅ THIS IS WHERE SOURCE GOES
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "project-service/target/project-service-1.0.0.jar"
          target: "/home/ec2-user/microservices/project-service"

          # 6️⃣ RUN SERVICE WITH DB CONFIG  ✅ THIS IS WHERE DB SECRETS GO
      - name: Restart Service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pkill -f project-service || true

            nohup java -jar $(ls /home/ec2-user/microservices/project-service/project-service-1.0.0.jar | head -n 1) \
              --spring.profiles.active=prod \
              --spring.datasource.username=${{ secrets.DB_USERNAME }} \
              --spring.datasource.password=${{ secrets.DB_PASSWORD }} \
              > /home/ec2-user/microservices/project-service/app.log 2>&1 < /dev/null &
